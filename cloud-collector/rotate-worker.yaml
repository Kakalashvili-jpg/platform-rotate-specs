apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-cloud-collector-rotate-worker
  namespace: ns-cld-cloud-collector-develop
  labels: {app: cloud-collector, component: rotate}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterrolebinding-cloud-collector-rotate-worker
  labels: {app: cloud-collector, component: rotate}
subjects:
- kind: ServiceAccount
  name: account-cloud-collector-rotate-worker
  namespace: ns-cld-cloud-collector-develop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cron-cloud-collector-rotate-worker-29836201
  namespace: ns-cld-cloud-collector-develop
  labels: {app: cloud-collector, component: rotate}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      serviceAccountName: account-cloud-collector-rotate-worker
      restartPolicy: Never
      containers:
      - name: worker
        image: bitnami/kubectl:latest
        env:
        - name: ROTATE_SPEC
          value: ""
        command: ["/bin/sh","-c"]
        args: ["echo \"$ROTATE_SPEC\" | base64 -d | /bin/sh"]
